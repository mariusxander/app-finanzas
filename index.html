<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#18264F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="shortcut icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F3F8; --surface:#FFFFFF; --surface2:#F6F7FB; --line:#DFE3EC; --ink:#111729; --muted:#596179;
  --accent:#18264F; --accent-ink:#FFFFFF; --accent-soft:#E4E8F5; --focus:#2a78d6;
  --inc:#2a78d6; --exp:#eb6834; --need:#6250d6; --want:#eda100; --save:#1baf7a;
  --good-text:#006300; --bad-text:#b42f2f; --warn-text:#8a5a00;
  --good-soft:#E1F3E1; --bad-soft:#FBE6E3; --warn-soft:#FBF0D3; --info-soft:#E4E8F5;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --overlay:rgba(10,14,28,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1020; --surface:#141A2E; --surface2:#1A2138; --line:#27304C; --ink:#E9ECF7; --muted:#9AA3BF;
    --accent:#C9D3FF; --accent-ink:#0C1020; --accent-soft:#232C52; --focus:#7fb0ff;
    --inc:#3987e5; --exp:#d95926; --need:#9085e9; --want:#c98500; --save:#199e70;
    --good-text:#3fd13f; --bad-text:#ff9a8a; --warn-text:#f2b34d;
    --good-soft:#12301A; --bad-soft:#3A1E19; --warn-soft:#3A2C10; --info-soft:#232C52;
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#141A2E; --surface2:#1A2138; --line:#27304C; --ink:#E9ECF7; --muted:#9AA3BF;
  --accent:#C9D3FF; --accent-ink:#0C1020; --accent-soft:#232C52; --focus:#7fb0ff;
  --inc:#3987e5; --exp:#d95926; --need:#9085e9; --want:#c98500; --save:#199e70;
  --good-text:#3fd13f; --bad-text:#ff9a8a; --warn-text:#f2b34d;
  --good-soft:#12301A; --bad-soft:#3A1E19; --warn-soft:#3A2C10; --info-soft:#232C52;
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.shell{max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-head);font-weight:600;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:18px;margin-right:auto}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 13px var(--font-ui)}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.monthnav button{border:0;background:none;border-radius:8px;min-width:36px;min-height:36px;display:grid;place-items:center}
.monthnav button:hover{background:var(--surface2)}
.monthnav .ml{min-width:138px;text-align:center;font-weight:600;padding:0 6px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;white-space:nowrap;cursor:pointer}
.pill:hover{background:var(--surface2);color:var(--ink)}
.pill.install{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pill.install:hover{opacity:.9;background:var(--accent);color:var(--accent-ink)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-soft);border-radius:10px;padding:10px 14px;margin:6px 0 4px}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:500;color:var(--muted);min-width:0}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--accent-soft);font-weight:600}
.t-short{display:none}
@media (max-width:540px){.t-full{display:none}.t-short{display:inline}.tab{font-size:10px}}
@media (min-width:760px){
  body{padding-block:0 90px}
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;border-bottom:1px solid var(--line);padding:0;margin:4px 0 18px;overflow-x:auto}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:10px 14px;border-radius:10px 10px 0 0;background:none!important;white-space:nowrap}
  .tab[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
}
.fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 20px;min-height:48px;font-weight:600;
  box-shadow:0 6px 18px rgba(10,14,28,.28);display:flex;align-items:center;gap:8px}
@media (min-width:760px){.fab{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.fab-split{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  display:flex;border-radius:999px;overflow:hidden;box-shadow:0 6px 18px rgba(10,14,28,.28);max-width:calc(100vw - 32px)}
.fab-split button{border:0;min-height:48px;padding:0 16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.fab-split .fab-add{background:var(--accent);color:var(--accent-ink)}
.fab-split .fab-ret{background:var(--exp);color:#fff}
.fab-split .fab-gain{background:var(--save);color:#fff}
.fab-split button:hover{opacity:.92}
@media (min-width:760px){.fab-split{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
@media (max-width:460px){.fab-split{left:16px;right:16px}.fab-split button{flex:1;padding:0 10px;font-size:13px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.stack{display:grid;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-head.pad{margin-top:22px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 16px;min-height:42px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.92}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--bad-text);border-color:var(--bad-text);background:none}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 36px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-num{font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.03em;margin:6px 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin:0}
.stat dt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat dd{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.delta{font-size:12px;font-weight:500;color:var(--muted)}
.delta.good{color:var(--good-text)} .delta.bad{color:var(--bad-text)}
.ins{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:0}
.tag{align-self:start;justify-self:start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad-text)} .tag.warn{background:var(--warn-soft);color:var(--warn-text)}
.tag.ok{background:var(--good-soft);color:var(--good-text)} .tag.info{background:var(--info-soft);color:var(--ink)}
.ins b{display:block;font-weight:600}
.ins span.t{color:var(--muted)}
@media (max-width:480px){.ins{grid-template-columns:minmax(0,1fr)}}
.cat{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;color:inherit}
.cat:first-child{border-top:0}
.cat-top{display:flex;align-items:baseline;gap:10px}
.cat-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cat-amt{margin-left:auto;font-weight:600;white-space:nowrap}
.cat-sub{display:flex;gap:10px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.kind{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:999px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--exp);border-radius:0 4px 4px 0}
.bud{margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meter{flex:1 1 90px;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;min-width:80px}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--save)}
.meter.warn>i{background:var(--want)} .meter.bad>i{background:var(--bad-text)}
.subrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0 0 14px;font-size:13px;color:var(--muted)}
.chev{display:inline-block;transition:transform .15s;margin-right:4px;color:var(--muted)}
.cat[aria-expanded="true"] .chev{transform:rotate(90deg)}
.seg-bar{display:flex;gap:2px;height:8px;margin:14px 0 4px;position:relative}
.seg-bar>i{display:block;height:100%;min-width:0}
.seg-bar>i:first-child{border-radius:999px 0 0 999px}.seg-bar>i:last-child{border-radius:0 999px 999px 0}
.seg-bar>i:only-child{border-radius:999px}
.legend{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.legend .lv{font-weight:600;white-space:nowrap}
.legend .ref{grid-column:2 / 4;font-size:12px;color:var(--muted)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg .sq{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:11px var(--font-ui)}
.ax.sel{fill:var(--ink);font-weight:700}
.selbg{fill:var(--accent-soft)}
.ln{fill:none;stroke:var(--save);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--save);opacity:.1}
.endlbl{fill:var(--ink);font:600 12px var(--font-ui)}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.welcome ol{margin:12px 0 18px;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.welcome li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 12px;align-items:start}
.welcome li::before{content:counter(s);grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700}
.welcome li .btn{justify-self:start;margin-top:6px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.filters .seg{grid-column:1 / -1}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button,.seg label{border:0;background:none;border-radius:7px;padding:7px 12px;font-weight:500;white-space:nowrap;color:var(--muted);cursor:pointer;text-align:center}
.seg button[aria-pressed="true"],.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,14,28,.15);font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+label{outline:2px solid var(--focus)}
.seg-full{display:flex;width:100%}.seg-full label,.seg-full button{flex:1}
.mv-total{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:4px 0 10px}
.mv-day{font-size:12px;font-weight:600;text-transform:capitalize;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.mv-day:first-child{border-top:0;margin-top:0;padding-top:2px}
.mv{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 6px;margin:0 -6px;border-radius:8px;width:calc(100% + 12px)}
.mv:hover{background:var(--surface2)}
.mv-title{font-weight:600;overflow-wrap:anywhere}
.mv-title em{font-style:normal;font-weight:400;color:var(--muted)}
.mv-meta{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mv-amt{font-weight:600;white-space:nowrap}
.mv-amt.in{color:var(--good-text)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;min-width:0}
.acc header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acc-bal{font-size:24px;font-weight:700;letter-spacing:-.02em}
.recon{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.recon label{font-size:12px;color:var(--muted)}
.rc-out{font-size:13px;min-height:20px}
.rc-out .ok{color:var(--good-text);font-weight:600}
.rc-out .diff{display:grid;gap:8px;justify-items:start}
.cardrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.cardrow:first-child{border-top:0;padding-top:0}
.cardrow .meter{grid-column:1 / -1;flex:none}
.p-share{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.p-share:first-child{border-top:0}
.p-share .bar>i{background:var(--save)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.inv-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0;align-content:start}
.inv-card header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inv-acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line)}
.inv-acts .btn{flex:1 1 auto;min-height:34px;padding:0 10px;font-size:12px}
.cp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.cp-cols{grid-template-columns:minmax(0,1fr)}}
.cp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cp:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1 / -1}
.chip{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:18px;padding:22px 24px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=url],input[type=password],input:not([type]),select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 12px;font-size:16px}
input[type=date]{min-width:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:400px){.row2{grid-template-columns:minmax(0,1fr)}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.err{color:var(--bad-text);font-weight:500}
.sub-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.del{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
@media (min-width:760px){.toast{bottom:calc(32px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">
  <header class="top">

const S={tab:'resumen',month:curMonth(),cfg:defaultCfg(),tx:[],pat:[],inv:[],bal:{},totalCash:0,totalSav:0,totalInvActive:0,totalInvProfit:0,
  filters:{type:'all',acc:'all',cat:'all',q:''},invFilters:{cat:'all',ent:'all'},expanded:{},sheet:null,demo:false,demoDocs:null,prefAcc:null};

/* ================= almacenamiento conectado a Google Sheets con PIN ================= */
const LS_KEY='misfinanzas.docs.v1',PREF_KEY='misfinanzas.pref.v1',URL_KEY='misfinanzas.url.v1',PIN_KEY='misfinanzas.pin.v1';
let memUrl='', memPin='';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}

function getScriptUrl(){return (DEFAULT_SCRIPT_URL || lsGet(URL_KEY) || memUrl || '').trim();}
function getPin(){return (lsGet(PIN_KEY) || ssGet(PIN_KEY) || memPin || '').trim();}

const Store={mode:'loading',ready:false,slow:false,error:null,locked:true,lockMsg:'',real:new Map(),chains:new Map()};

function persistLocal(){lsSet(LS_KEY,JSON.stringify(Array.from(Store.real.entries())));}
function serial(id,fn){const p=(Store.chains.get(id)||Promise.resolve()).catch(function(){}).then(fn);Store.chains.set(id,p);return p;}

function saveError(e){
  console.error('Error sincronizando con Sheets:', e);
  Store.slow=true;
  renderChrome();
  toast('Guardado localmente. No se pudo sincronizar con Google Sheets.');
}

function sendToSheets(payload){
  const url = getScriptUrl();
  if(!url) return Promise.resolve();
  payload.pin = getPin();
  Store.slow=true;
  renderChrome();
  return fetch(url.split('?')[0], {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if(res && res.status === 'unauthorized'){
      bloquearApp('PIN incorrecto o modificado en Sheets.');
      throw new Error('PIN incorrecto');
    }
    if(!res || res.status !== 'ok') throw new Error((res && res.message) || 'Error en Sheets');
    Store.slow=false;
    Store.error=null;
    renderChrome();
    return res;
  });
}

function put(id,data){
  Store.real.set(id,clone(data));
  persistLocal();
  changed();
  if(Store.mode==='cloud'){
    return serial(id,function(){
      return sendToSheets({action:'put', id:id, data:data});
    }).catch(saveError);
  }
  return Promise.resolve();
}

function del(id){
  Store.real.delete(id);
  persistLocal();
  changed();
  if(Store.mode==='cloud'){
    return serial(id,function(){
      return sendToSheets({action:'del', id:id});
    }).catch(saveError);
  }
  return Promise.resolve();
}

function editCfg(fn){const c=clone(S.cfg);c.k='cfg';c.v=1;fn(c);return put('cfg',c);}

function bloquearApp(msg){
  lsDel(PIN_KEY);
  ssDel(PIN_KEY);
  memPin = '';
  Store.locked = true;
  Store.lockMsg = msg || '';
  Store.ready = true;
  renderAll();
}

function configurarUrlSheets(){
  if(Store.locked) return;
  const op = window.prompt('Escribe "1" para bloquear la app ahora, o pega una nueva URL /exec de Google Sheets:', getScriptUrl());
  if(op === null) return;
  if(op.trim() === '1'){
    bloquearApp('Sesión bloqueada.');
    return;
  }
  const limpia = op.trim().split('?')[0];
  memUrl = limpia;
  lsSet(URL_KEY, limpia);
  initStore();
}

async function initStore(){
  try {
    const url = getScriptUrl();
    const pin = getPin();

    if(!pin || !url || url.indexOf('https://script.google.com') !== 0){
      Store.locked = true;
      Store.ready = true;
      renderAll();
      return;
    }

    Store.locked = false;
    Store.lockMsg = '';

    try{
      const raw=lsGet(LS_KEY);
      if(raw) Store.real=new Map(JSON.parse(raw));
    }catch(e){ Store.real=new Map(); }

    Store.mode='cloud';
    Store.slow=true;
    Store.ready=true;
    changed();

    const cleanUrl = url.split('?')[0];
    const res = await fetch(cleanUrl + '?api=1&pin=' + encodeURIComponent(pin), { redirect: 'follow' });
    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch(parseErr) {
      throw new Error('Tu Apps Script devolvió HTML en lugar de JSON. Publica una Nueva Versión en Apps Script.');
    }

    if(json && json.status === 'unauthorized'){
      lsDel(LS_KEY);
      Store.real = new Map();
      bloquearApp('El PIN ingresado es incorrecto.');
      return;
    }

    if(json && json.status === 'ok' && Array.isArray(json.entries)){
      if(json.entries.length > 0){
        Store.real = new Map(json.entries);
        persistLocal();
      } else if(Store.real.size > 0){
        await sendToSheets({action:'sync_all', entries: Array.from(Store.real.entries())});
      }
      Store.slow=false;
      Store.error=null;
    } else {
      throw new Error((json && json.message) || 'Respuesta inválida de Sheets');
    }
  } catch(e) {
    console.error('Error al leer Google Sheets:', e);
    Store.error = e;
    Store.slow = true;
  }
  Store.ready=true;
  changed();
}

/* ================= derivados ================= */
function activeDocs(){return S.demo?S.demoDocs:Store.real;}
function derive(){
  const docs=activeDocs();
  S.cfg=normCfg(docs.get('cfg'));
  S.tx=[];S.pat=[];S.inv=[];
  docs.forEach(function(d,id){
    if(!d)return;
    if(d.k==='tx')S.tx.push(Object.assign({},d,{id:id}));
    else if(d.k==='pat')S.pat.push(Object.assign({},d,{id:id}));
    else if(d.k==='inv')S.inv.push(Object.assign({},d,{id:id}));
  });
  const cmp=function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);};
  S.tx.sort(cmp);S.pat.sort(cmp);S.inv.sort(cmp);
  const b={};S.cfg.accounts.forEach(function(a){b[a.id]=Number(a.initial)||0;});
  S.tx.forEach(function(t){
    if(t.type==='in'){if(b[t.acc]!=null)b[t.acc]+=t.amount;}
    else if(t.type==='out'){if(b[t.acc]!=null)b[t.acc]-=t.amount;}
    else if(t.type==='tr'){if(b[t.acc]!=null)b[t.acc]-=t.amount;if(b[t.to]!=null)b[t.to]+=t.amount;}
  });
  S.pat.forEach(function(p){if(p.acc&&b[p.acc]!=null)b[p.acc]-=p.amount;});
  let invSavDelta=0, invActive=0, invProfit=0;
  S.inv.forEach(function(x){
    const amt=Number(x.amount)||0;
    if(x.action==='out'){
      invActive+=amt;
      if(x.sourceType==='acc'&&x.acc&&b[x.acc]!=null) b[x.acc]-=amt;
      else if(x.sourceType==='sav') invSavDelta-=amt;
    } else if(x.action==='return'){
      invActive-=amt;
      if(x.sourceType==='acc'&&x.acc&&b[x.acc]!=null) b[x.acc]+=amt;
      else if(x.sourceType==='sav') invSavDelta+=amt;
    } else if(x.action==='profit'){
      invProfit+=amt;
      if(x.sourceType==='reinvest') invActive+=amt;
      else if(x.sourceType==='acc'&&x.acc&&b[x.acc]!=null) b[x.acc]+=amt;
      else if(x.sourceType==='sav') invSavDelta+=amt;
    }
  });
  S.bal=b;
  S.totalCash=Object.keys(b).reduce(function(s,k){return s+b[k];},0);
  S.totalSav=S.pat.reduce(function(s,p){return s+p.amount;},0)+invSavDelta;
  S.totalInvActive=invActive;
  S.totalInvProfit=invProfit;
}
function changed(){derive();renderAll();}

function catList(type){return type==='in'?S.cfg.income:S.cfg.expense;}
function findCat(type,id){return catList(type).find(function(c){return c.id===id;});}

function subName(t){if(!t.sub)return '';const c=findCat(t.type,t.cat);const s=c&&c.subs?c.subs.find(function(x){return x.id===t.sub;}):null;return s?s.name:(t.subName||'');}
function accName(id){const a=S.cfg.accounts.find(function(x){return x.id===id;});return a?a.name:'Cuenta eliminada';}
function kindOf(catId){const c=findCat('out',catId);return c?c.kind:'need';}

function savEvents(){
  const ev=[];
  S.pat.forEach(function(p){
    ev.push({id:p.id,kind:'pat',date:p.date,place:p.place||'Sin nombre',amount:p.amount,acc:p.acc||'',note:p.note||'',ts:p.ts||0});
  });
  S.inv.forEach(function(x){
    if(x.sourceType!=='sav')return;
    const amt=x.action==='out'?-x.amount:x.amount;
    const tagLbl=x.action==='out'?(x.category==='loan'?'Préstamo a ':'Inversión en ')+x.entity:(x.action==='return'?'Devolución de ':(x.category==='loan'?'Interés de ':'Dividendo de '))+x.entity;
    ev.push({id:x.id,kind:'inv',date:x.date,place:x.savPlace||'Ahorros',amount:amt,acc:'',invTag:tagLbl,note:x.note||'',ts:x.ts||0});
  });
  ev.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);});
  return ev;
}

function monthStats(m){
  let inc=0,out=0;const byCat={},byInc={};
  S.tx.forEach(function(t){
    if(t.adj||t.type==='tr'||t.date.slice(0,7)!==m)return;
    if(t.type==='in'){inc+=t.amount;const e=byInc[t.cat]||(byInc[t.cat]={name:catName(t),total:0});e.total+=t.amount;}
    else if(t.type==='out'){
      out+=t.amount;
      const c=byCat[t.cat]||(byCat[t.cat]={name:catName(t),total:0,subs:{}});
      c.total+=t.amount;const k=t.sub||'_';
      const s=c.subs[k]||(c.subs[k]={name:subName(t)||'Sin detalle',total:0});s.total+=t.amount;
    }
  });
  return {inc:inc,out:out,byCat:byCat,byInc:byInc};
}

function insights(m,st,pv){
  const res=[];const add=function(sev,title,text){res.push({sev:sev,title:title,text:text});};
  if(!st.inc&&!st.out)return res;
  const bal=st.inc-st.out;
  if(st.inc>0){
    const rate=bal/st.inc;
    if(rate<0)add('bad','Gastaste más de lo que ingresó','Tus egresos superan a tus ingresos por '+money(-bal)+'. Empieza por las categorías que más subieron.');
    else if(rate<0.1)add('warn','Solo ahorraste el '+pct(rate)+' de tus ingresos','Una referencia común es 20%. Lo más fácil de recortar suelen ser los deseos: salidas, extras, compras.');
    else if(rate>=0.2)add('ok','Ahorraste el '+pct(rate)+' de tus ingresos','Vas por encima del 20% de referencia. Si te sobra, regístralo en Ahorros para que no se diluya.');
    let needs=0,wants=0;const wl=[];
    Object.keys(st.byCat).forEach(function(id){const c=st.byCat[id];if(kindOf(id)==='want'){wants+=c.total;wl.push(c);}else needs+=c.total;});
    wl.sort(function(a,b){return b.total-a.total;});
    if(wants/st.inc>0.3)add('warn','Tus deseos son el '+pct(wants/st.inc)+' de tus ingresos','La referencia es 30%. Los que más pesan: '+wl.slice(0,2).map(function(c){return c.name+' ('+money(c.total)+')';}).join(' y ')+'.');
    if(needs/st.inc>0.6)add('info','Tus necesidades son el '+pct(needs/st.inc)+' de tus ingresos','La referencia es 50%. Revisa Hogar y Comida primero: suelen tener margen sin afectar tu día a día.');
  }
  S.cfg.expense.forEach(function(c){
    if(!(c.budget>0))return;
    const sp=(st.byCat[c.id]||{total:0}).total;
    if(sp>c.budget)add('bad',c.name+' pasó su límite','Llevas '+money(sp)+' de '+money(c.budget)+' ('+pct(sp/c.budget)+').');
    else if(sp>=c.budget*0.85)add('warn',c.name+' está cerca de su límite','Llevas '+money(sp)+' de '+money(c.budget)+' ('+pct(sp/c.budget)+').');
  });
  const ups=[];
  Object.keys(st.byCat).forEach(function(id){
    const cur=st.byCat[id].total,pr=(pv.byCat[id]||{total:0}).total;
    if(pr>0&&cur-pr>=50&&cur/pr>=1.25)ups.push({n:st.byCat[id].name,cur:cur,pr:pr,d:cur-pr});
    else if(pr===0&&cur>=150&&pv.out>0)add('info','Gasto nuevo en '+st.byCat[id].name,'No tuviste gastos aquí el mes anterior y ya suman '+money(cur)+'.');
  });
  ups.sort(function(a,b){return b.d-a.d;}).slice(0,2).forEach(function(u){
    add('warn',u.n+' subió '+pct(u.cur/u.pr-1),'Pasó de '+money(u.pr)+' a '+money(u.cur)+' ('+money(u.d,{sign:true})+' frente al mes anterior).');
  });
  const ids=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b].total-st.byCat[a].total;});
  if(ids.length&&st.out>0&&st.byCat[ids[0]].total/st.out>0.35)add('info',st.byCat[ids[0]].name+' concentra el '+pct(st.byCat[ids[0]].total/st.out)+' de tus egresos','Es normal si es una necesidad fija. Si no lo es, aquí está tu mejor oportunidad de ahorro.');
  if(m===curMonth()){
    const day=new Date().getDate(),dim=daysIn(m);
    if(day>=8&&pv.out>0){
      const proj=st.out/day*dim;
      if(proj>pv.out*1.15)add('warn','A este ritmo cerrarás con '+money(proj),'El mes pasado gastaste '+money(pv.out)+'. Llevas '+money(st.out)+' en '+day+' días.');
    }
  }
  const order={bad:0,warn:1,info:2,ok:3};
  res.sort(function(a,b){return order[a.sev]-order[b.sev];});
  const out=res.slice(0,6);
  if(!out.length&&st.out>0)out.push({sev:'ok',title:'Todo en orden este mes',text:'No veo subidas fuertes ni límites superados. Sigue registrando para mantener el panorama claro.'});
  return out;
}

function viewResumen(){

  const m=S.month,st=monthStats(m),pv=monthStats(shiftMonth(m,-1));
  const bal=st.inc-st.out,rate=st.inc>0?bal/st.inc:null;
  const dlt=function(cur,pr,upGood){
    if(!(pr>0))return '';
    const ch=cur/pr-1;if(Math.abs(ch)<0.005)return '<span class="delta">igual que '+monthLabel(shiftMonth(m,-1),true)+'</span>';
    const up=ch>0,good=(up===upGood);
    return '<span class="delta '+(good?'good':'bad')+'">'+(up?'▲ ':'▼ ')+pct(Math.abs(ch))+' vs '+monthLabel(shiftMonth(m,-1),true)+'</span>';
  };
  let html='<div class="stack">';
  html+='<section class="card hero"><div><div class="eyebrow">Balance de '+esc(monthLabel(m))+'</div>'+
    '<div class="hero-num num">'+money(bal,{sign:true})+'</div>'+
    '<p class="muted">'+(st.inc||st.out?('Ingresaste '+money(st.inc)+' y gastaste '+money(st.out)+(rate!==null?'. Ahorro del mes: '+pct(rate)+'.':'.')):'Aún no hay movimientos este mes.')+'</p></div>'+
    '<dl class="stats">'+
    '<div class="stat"><dt><span class="dot" style="background:var(--inc)"></span>Ingresos</dt><dd class="num">'+money(st.inc)+'</dd>'+dlt(st.inc,pv.inc,true)+'</div>'+
    '<div class="stat"><dt><span class="dot" style="background:var(--exp)"></span>Egresos</dt><dd class="num">'+money(st.out)+'</dd>'+dlt(st.out,pv.out,false)+'</div>'+
    '<div class="stat"><dt>Saldo en cuentas</dt><dd class="num">'+money(S.totalCash)+'</dd></div>'+
    '<div class="stat"><dt>Mis ahorros líquidos</dt><dd class="num">'+money(S.totalSav)+'</dd></div>'+
    (S.inv.length?('<div class="stat"><dt><span class="dot" style="background:var(--need)"></span>Préstamos e inv.</dt><dd class="num">'+money(S.totalInvActive)+'</dd>'+(S.totalInvProfit>0?'<span class="delta good">+'+money(S.totalInvProfit)+' ganados</span>':'')+'</div>'+
    '<div class="stat"><dt>Patrimonio total</dt><dd class="num">'+money(S.totalCash+S.totalSav+S.totalInvActive)+'</dd></div>'):'')+'</dl></section>';

  const ins=insights(m,st,pv);
  if(ins.length){
    html+='<section class="card"><div class="sec-head"><h2>Qué mejorar</h2></div>'+
      ins.map(function(i){return '<div class="ins"><span class="tag '+i.sev+'">'+tag(i.sev)+'</span><div><b>'+esc(i.title)+'</b><span class="t">'+esc(i.text)+'</span></div></div>';}).join('')+'</section>';
  }

  const ids=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b].total-st.byCat[a].total;});
  const maxC=ids.length?st.byCat[ids[0]].total:1;
  let catHtml='<section class="card"><div class="sec-head"><h2>En qué gasto</h2><span class="muted num">'+money(st.out)+'</span></div>';
  if(!ids.length)catHtml+='<p class="empty">No hay egresos en '+esc(monthLabel(m))+'.</p>';
  ids.forEach(function(id){
    const c=st.byCat[id],cfgc=findCat('out',id),prT=(pv.byCat[id]||{total:0}).total;
    let d='';
    if(prT>0){const ch=c.total/prT-1;if(Math.abs(ch)>=0.01)d='<span class="delta '+(ch>0?'bad':'good')+'">'+(ch>0?'▲ ':'▼ ')+pct(Math.abs(ch))+'</span>';}
    else d='<span class="delta">nuevo</span>';
    const open=!!S.expanded[id];
    let bud='';
    if(cfgc&&cfgc.budget>0){
      const r=c.total/cfgc.budget,cls=r>1?'bad':r>=0.85?'warn':'';
      bud='<div class="bud"><span>Límite '+money(cfgc.budget)+'</span><span class="meter '+cls+'" aria-hidden="true"><i style="width:'+Math.min(100,r*100).toFixed(1)+'%"></i></span><span>'+pct(r)+(r>1?' · pasado':'')+'</span></div>';
    }
    catHtml+='<div><button type="button" class="cat" data-a="toggle-cat" data-id="'+esc(id)+'" aria-expanded="'+open+'">'+
      '<div class="cat-top"><span class="cat-name"><span class="chev" aria-hidden="true">›</span>'+esc(c.name)+'</span><span class="cat-amt num">'+money(c.total)+'</span></div>'+
      '<div class="cat-sub"><span class="kind">'+(kindOf(id)==='want'?'Deseo':'Necesidad')+'</span><span>'+pct(c.total/st.out)+' de tus egresos</span>'+d+'</div>'+
      '<div class="bar" aria-hidden="true"><i style="width:'+(c.total/maxC*100).toFixed(1)+'%"></i></div>'+bud+'</button>';
    if(open){
      const sk=Object.keys(c.subs).sort(function(a,b){return c.subs[b].total-c.subs[a].total;});
      catHtml+=sk.map(function(k){return '<div class="subrow"><span>'+esc(c.subs[k].name)+'</span><span class="num">'+money(c.subs[k].total)+'</span></div>';}).join('')+'<div style="height:8px"></div>';
    }
    catHtml+='</div>';
  });
  catHtml+='</section>';

  let needs=0,wants=0;

    const sv=Math.max(0,bal),T=Math.max(st.inc,needs+wants+sv);
    const seg=function(v,c){return v>0?'<i style="width:'+(v/T*100).toFixed(2)+'%;background:var(--'+c+')"></i>':'';};
    const row=function(c,n,v,ref,ok){return '<li><span class="dot" style="background:var(--'+c+')"></span><span>'+n+'</span><span class="lv num">'+money(v)+' · '+pct(v/st.inc)+'</span><span class="ref">Referencia '+ref+' · '+ok+'</span></li>';};
    rule+='<div class="seg-bar" role="img" aria-label="Necesidades '+pct(needs/st.inc)+', deseos '+pct(wants/st.inc)+', ahorro '+pct(sv/st.inc)+' de tus ingresos">'+seg(needs,'need')+seg(wants,'want')+seg(sv,'save')+'</div>'+
      '<ul class="legend">'+
      row('need','Necesidades',needs,'50%',needs/st.inc<=0.5?'dentro':'por encima')+
      row('want','Deseos',wants,'30%',wants/st.inc<=0.3?'dentro':'por encima')+
      row('save','Ahorro',sv,'20%',sv/st.inc>=0.2?'cumplido':'por debajo')+'</ul>';
  }else rule+='<p class="empty">Registra ingresos del mes para ver cómo se reparten.</p>';
  rule+='</section>';
  const incIds=Object.keys(st.byInc).sort(function(a,b){return st.byInc[b].total-st.byInc[a].total;});
  let incHtml='<section class="card"><div class="sec-head"><h2>Ingresos del mes</h2></div>';
  incHtml+=incIds.length?incIds.map(function(id){return '<div class="list-row"><span>'+esc(st.byInc[id].name)+'</span><b class="num">'+money(st.byInc[id].total)+'</b></div>';}).join(''):'<p class="empty">Sin ingresos este mes.</p>';
  incHtml+='</section>';
  html+='<div class="grid2">'+catHtml+'<div class="stack">'+rule+incHtml+'</div></div>';
  html+='<section class="card chart"><div class="sec-head"><h2>Últimos 6 meses</h2></div>'+chartMonths(m)+'</section></div>';
  return html;
}

function chartMonths(sel){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(sel,-i));
  const data=ms.map(function(m){const s=monthStats(m);return {m:m,inc:s.inc,out:s.out};});
  const mx=niceMax(Math.max.apply(null,data.reduce(function(a,d){a.push(d.inc,d.out);return a;},[1])));
  const W=chartW(),H=232,L=44,R=6,T=12,B=30,iw=W-L-R,ih=H-T-B,base=T+ih;
  const gw=iw/data.length,bw=Math.min(22,gw*0.34),gap=2;
  const y=function(v){return base-(v/mx)*ih;};
  let g='';
  [0,0.5,1].forEach(function(f){const v=mx*f,yy=y(v);g+='<line class="'+(f===0?'base':'gl')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end">'+fmtK(v)+'</text>';});
  let b='';
  data.forEach(function(d,i){
    const cx=L+gw*i+gw/2,isSel=d.m===sel;
    if(isSel)b+='<rect class="selbg" x="'+(L+gw*i+3).toFixed(1)+'" y="'+T+'" width="'+(gw-6).toFixed(1)+'" height="'+ih+'" rx="6"/>';
    const bar=function(x,v,c){const h=base-y(v);if(h<=0)return '';const r=Math.min(4,h,bw/2);
      return '<path d="M'+x.toFixed(1)+' '+base+'V'+(base-h+r).toFixed(1)+'a'+r+' '+r+' 0 0 1 '+r+' -'+r+'h'+(bw-2*r).toFixed(1)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'V'+base+'Z" fill="var(--'+c+')"/>';};
    b+='<g><title>'+esc(monthLabel(d.m))+': ingresos '+money(d.inc)+', egresos '+money(d.out)+'</title>'+bar(cx-bw-gap/2,d.inc,'inc')+bar(cx+gap/2,d.out,'exp')+'</g>';
    b+='<text class="ax'+(isSel?' sel':'')+'" x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(monthLabel(d.m,true))+'</text>';
  });
  const cur=data[data.length-1];
  return '<div class="lg"><span><i class="sq" style="background:var(--inc)"></i>Ingresos</span><span><i class="sq" style="background:var(--exp)"></i>Egresos</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y egresos de los últimos 6 meses. '+esc(monthLabel(cur.m))+': ingresos '+money(cur.inc)+', egresos '+money(cur.out)+'">'+g+b+'</svg>';
}

function movListHtml(){
  const f=S.filters,q=f.q.trim().toLowerCase();
  const rows=S.tx.filter(function(t){
    if(t.date.slice(0,7)!==S.month)return false;
    if(f.type!=='all'&&t.type!==f.type)return false;
    if(f.acc!=='all'&&t.acc!==f.acc&&t.to!==f.acc)return false;
    if(f.cat!=='all'){const p=f.cat.split(':');if(t.type!==p[0]||t.cat!==p[1])return false;}
    if(q){const hay=((t.type==='tr'?'transferencia':catName(t))+' '+subName(t)+' '+(t.note||'')+' '+accName(t.acc)).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  if(!rows.length)return '<p class="empty">No hay movimientos con estos filtros en '+esc(monthLabel(S.month))+'.</p>';
  let inc=0,out=0;rows.forEach(function(t){if(t.adj||t.type==='tr')return;if(t.type==='in')inc+=t.amount;else out+=t.amount;});
  let h='<div class="mv-total"><span>'+rows.length+' movimientos</span><span>Ingresos <b class="num">'+money(inc)+'</b></span><span>Egresos <b class="num">'+money(out)+'</b></span></div>';
  let last='';
  rows.forEach(function(t){
    if(t.date!==last){h+='<div class="mv-day">'+esc(dayLabel(t.date))+'</div>';last=t.date;}
    let title,meta,amt,dotc;
    if(t.type==='tr'){title='Transferencia';meta=accName(t.acc)+' → '+accName(t.to);amt='<span class="mv-amt num">'+money(t.amount)+'</span>';dotc='var(--muted)';}
    else{
      const sn=subName(t);title=esc(catName(t))+(sn?' <em>· '+esc(sn)+'</em>':'');meta=accName(t.acc);
      amt='<span class="mv-amt num '+(t.type==='in'?'in':'')+'">'+(t.type==='in'?'+':'−')+money(t.amount).replace('S/ ','S/ ')+'</span>';

  });
  return h;
}

function placesAgg(){
  const m=new Map();
  savEvents().forEach(function(p){
    const nm=(p.place||'Sin nombre').trim(),k=nm.toLowerCase();
    const e=m.get(k)||{name:nm,total:0,n:0};
    e.total+=p.amount;e.n++;m.set(k,e);
  });
  return Array.from(m.values()).sort(function(a,b){return b.total-a.total;});
}
function chartPat(){
  const ev=savEvents();
  if(!ev.length)return '';

  const end=months[months.length-1]>curMonth()?months[months.length-1]:curMonth();
  let ms=[],m=months[0];while(m<=end&&ms.length<120){ms.push(m);m=shiftMonth(m,1);}
  ms=ms.slice(-18);
  if(ms.length<2)return '<p class="hint">La evolución aparece cuando tengas ahorros en dos meses distintos.</p>';
  const vals=ms.map(function(mm){return ev.reduce(function(s,p){return p.date.slice(0,7)<=mm?s+p.amount:s;},0);});
  const mx=niceMax(Math.max.apply(null,vals.concat([1])));
  const W=chartW(),H=210,L=44,R=14,T=22,B=28,iw=W-L-R,ih=H-T-B,base=T+ih,n=ms.length;
  const x=function(i){return L+iw*i/(n-1);},y=function(v){return base-Math.max(0,v)/mx*ih;};
  let g='';[0,0.5,1].forEach(function(f){const v=mx*f,yy=y(v);g+='<line class="'+(f===0?'base':'gl')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end">'+fmtK(v)+'</text>';});
  const pts=vals.map(function(v,i){return x(i).toFixed(1)+' '+y(v).toFixed(1);});
  const step=Math.ceil(n/5);let lbl='';
  ms.forEach(function(mm,i){if((n-1-i)%step===0)lbl+='<text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'">'+esc(monthLabel(mm,true))+'</text>';});
  const lx=x(n-1),ly=y(vals[n-1]);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de tus ahorros. Total actual '+money(vals[n-1])+'">'+g+
    '<path class="ar" d="M'+pts.join('L')+'L'+lx.toFixed(1)+' '+base+'L'+x(0).toFixed(1)+' '+base+'Z"/><path class="ln" d="M'+pts.join('L')+'"/>'+
    '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5" fill="var(--save)" stroke="var(--surface)" stroke-width="2"/>'+
    '<text class="endlbl" x="'+lx.toFixed(1)+'" y="'+Math.max(12,ly-12).toFixed(1)+'" text-anchor="end">'+money(vals[n-1])+'</text>'+lbl+'</svg>';
}

/* ================= Préstamos e Inversiones ================= */
function invEntitiesAgg(){
  const m=new Map();
  S.inv.forEach(function(x){
    const cat=x.category==='invest'?'invest':'loan';
    const nm=(x.entity||'Sin nombre').trim();
    const k=cat+'::'+nm.toLowerCase();
    let e=m.get(k);
    if(!e) e={cat:cat,name:nm,invested:0,returned:0,active:0,profit:0,expectedInterest:0,lastDate:'',lastProfitDate:'',n:0,profitCount:0};
    const amt=Number(x.amount)||0;
    if(x.action==='out'){
      e.invested+=amt;
      e.active+=amt;
      if(cat==='loan'&&Number(x.expectedInterest)>0) e.expectedInterest+=Number(x.expectedInterest);
    }
    else if(x.action==='return'){e.returned+=amt;e.active-=amt;}
    else if(x.action==='profit'){
      e.profit+=amt;e.profitCount++;
      if(x.sourceType==='reinvest'){e.invested+=amt;e.active+=amt;}
      if(!e.lastProfitDate||x.date>e.lastProfitDate)e.lastProfitDate=x.date;
    }
    if(!e.lastDate||x.date>e.lastDate)e.lastDate=x.date;
    e.n++;
    m.set(k,e);
  });
  return Array.from(m.values()).sort(function(a,b){
    const pa=(a.active>0.005?a.active:0)+Math.max(0,a.expectedInterest-a.profit);
    const pb=(b.active>0.005?b.active:0)+Math.max(0,b.expectedInterest-b.profit);
    return pb-pa||b.profit-a.profit;
  });
}

function invEntitySuggestions(cat){

}

function chartInvProfits(){
  const now=curMonth(),ms=[];
  for(let i=5;i>=0;i--)ms.push(shiftMonth(now,-i));
  const data=ms.map(function(m){
    const p=S.inv.filter(function(x){return x.action==='profit'&&x.date.slice(0,7)===m;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    return {m:m,val:p};
  });
  const total6=data.reduce(function(s,d){return s+d.val;},0);
  if(total6<=0)return '<p class="hint">Cuando registres dividendos o intereses, aquí verás cuánto te generan mes a mes.</p>';
  const mx=niceMax(Math.max.apply(null,data.map(function(d){return d.val;}).concat([1])));
  const W=chartW(),H=200,L=44,R=8,T=14,B=28,iw=W-L-R,ih=H-T-B,base=T+ih;
  const gw=iw/data.length,bw=Math.min(34,gw*0.48);
  const y=function(v){return base-(v/mx)*ih;};
  let g='';
  [0,0.5,1].forEach(function(f){const v=mx*f,yy=y(v);g+='<line class="'+(f===0?'base':'gl')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end">'+fmtK(v)+'</text>';});
  let b='';
  data.forEach(function(d,i){
    const cx=L+gw*i+gw/2,h=base-y(d.val);
    if(h>0){
      const r=Math.min(5,h,bw/2),x0=cx-bw/2;
      b+='<g><title>'+esc(monthLabel(d.m))+': '+money(d.val)+'</title><path d="M'+x0.toFixed(1)+' '+base+'V'+(base-h+r).toFixed(1)+'a'+r+' '+r+' 0 0 1 '+r+' -'+r+'h'+(bw-2*r).toFixed(1)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'V'+base+'Z" fill="var(--save)"/></g>';
    }
    b+='<text class="ax'+(d.m===now?' sel':'')+'" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(monthLabel(d.m,true))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dividendos y ganancias de los últimos 6 meses">'+g+b+'</svg>';
}

function saveTx(again){
  const v=txValues();const amount=parseAmount(v.amt);
  if(!S.cfg.accounts.length)return fail('Primero crea una cuenta en la pestaña Cuentas.');
  if(!(amount>0))return fail('Escribe un monto mayor a 0.');
  if(!v.date)return fail('Elige una fecha.');
  if(v.type!=='tr'&&!v.adj&&!v.cat)return fail('Elige un concepto.');
  if(!v.acc)return fail('Elige una cuenta.');
  if(v.type==='tr'&&(!v.to||v.to===v.acc))return fail('Elige dos cuentas distintas.');
  const doc={k:'tx',type:v.type,date:v.date,amount:amount,acc:v.acc,note:v.note.trim(),ts:S.sheet.ts||Date.now()};
  if(v.type==='tr')doc.to=v.to;
  else if(v.adj){doc.adj=true;doc.cat='ajuste';doc.catName='Ajuste de saldo';}
  else{const c=findCat(v.type,v.cat);doc.cat=v.cat;doc.catName=c?c.name:'';
    const s=c&&c.subs?c.subs.find(function(x){return x.id===v.sub;}):null;if(s){doc.sub=s.id;doc.subName=s.name;}}
  const isNew=!S.sheet.id;
  lsSet(PREF_KEY,JSON.stringify({acc:v.acc}));S.prefAcc=v.acc;
  put(S.sheet.id||('t'+uid()),doc);
  if(again&&isNew){
    toast(TYPE_LABEL[v.type]+' guardado. Registra otro.');
    S.sheet={kind:'tx',id:null,ts:null,adjTx:false,adjType:null};
    v.amt='';v.note='';$('#sheet-body').innerHTML=txFormHtml(v);const f=$('#tx-amt');if(f)f.focus();
  }else{closeSheet();toast(TYPE_LABEL[v.type]+(isNew?' guardado':' actualizado'));}
  return true;
}

  const isOut=v.act==='out', isProfit=v.act==='profit';
  const places=placesAgg();
  const sugs=invEntitySuggestions(v.cat);
  const srcOpts=isOut
    ? [['sav','Desde mis Ahorros'],['acc','Desde una cuenta personal'],['none','Solo registrar (no descontar de saldos)']]
    : isProfit
      ? [['sav','Dejar en mis Ahorros'],['acc','Mover a una cuenta personal'],['reinvest','Reinvertir aquí mismo (suma al capital)'],['none','Solo registrar (sin afectar saldos)']]
      : [['sav','Devolver a mis Ahorros'],['acc','Mover a una cuenta personal'],['none','Solo registrar (sin afectar saldos)']];
  if(!srcOpts.some(function(o){return o[0]===v.src;})) v.src=srcOpts[0][0];

  const srcLbl=isOut?'¿De dónde sale el dinero?':(isProfit?'¿Dónde recibes esta ganancia / dividendo?':'¿Dónde recibes la devolución?');
  const actLabels=isLoan
    ? [['out','Prestar'],['return','Cobro capital'],['profit','Interés']]
    : [['out','Invertir'],['return','Retirar capital'],['profit','Dividendo']];

  return '<form id="sheet-form" novalidate autocomplete="off">'+
    (S.sheet&&S.sheet.convertFromPatId?'<div class="banner" style="margin:0;font-size:13px">Al guardar, este registro reemplazará el retiro original de Ahorros sin descontar tu saldo dos veces.</div>':'')+
    '<div class="seg seg-full" role="radiogroup" aria-label="Categoría">'+
      '<input type="radio" name="inv-cat" id="ic-loan" value="loan"'+(isLoan?' checked':'')+'><label for="ic-loan">Préstamo</label>'+
      '<input type="radio" name="inv-cat" id="ic-invest" value="invest"'+(isLoan?'':' checked')+'><label for="ic-invest">Inversión</label></div>'+
    '<div class="seg seg-full" role="radiogroup" aria-label="Tipo de movimiento">'+
      actLabels.map(function(a){return '<input type="radio" name="inv-act" id="ia-'+a[0]+'" value="'+a[0]+'"'+(v.act===a[0]?' checked':'')+'><label for="ia-'+a[0]+'">'+a[1]+'</label>';}).join('')+'</div>'+
    '<div class="field"><label for="inv-ent">'+(isLoan?'¿A quién le prestas / quién paga?':'Nombre de la empresa o inversión')+'</label>'+
      '<input id="inv-ent" list="inv-ents" maxlength="60" placeholder="'+(isLoan?'Ej. Alberto, Jeen':'Ej. Empresa de dividendos')+'" value="'+esc(v.entity)+'">'+
      '<datalist id="inv-ents">'+sugs.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div>'+
    '<div class="row2"><div class="field"><label for="inv-amt">Monto (S/)</label><input id="inv-amt" inputmode="decimal" placeholder="0.00" value="'+esc(v.amt)+'"></div>'+
    '<div class="field"><label for="inv-date">Fecha</label><input id="inv-date" type="date" value="'+esc(v.date)+'"></div></div>'+
    (isLoan&&isOut?'<div class="field"><label for="inv-exp-int">Interés acordado (S/, opcional)</label><input id="inv-exp-int" inputmode="decimal" placeholder="Ej. 40.00 (vacío si es sin interés)" value="'+esc(v.expInt)+'"><span class="hint">La tarjeta no pasará a Liquidado hasta que cobres el capital y este interés.</span></div>':'')+
    '<div class="field"><label for="inv-src">'+srcLbl+'</label><select id="inv-src">'+
      srcOpts.map(function(o){return '<option value="'+o[0]+'"'+(v.src===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>'+

function openInv(x,preset){
  loadPref();
  const pr=preset||{};
  let v;
  if(x){
    v={cat:x.category||'loan',act:x.action||'out',entity:x.entity||'',amt:String(x.amount),date:x.date,expInt:x.expectedInterest>0?String(x.expectedInterest):'',src:x.sourceType||'sav',savPlace:x.savPlace||(placesAgg()[0]||{}).name||'',acc:x.acc||defaultAcc(),note:x.note||''};
  } else {
    v={cat:pr.cat||'loan',act:pr.act||'out',entity:pr.entity||'',amt:pr.amt||'',date:pr.date||todayStr(),expInt:pr.expInt||'',src:pr.src||'sav',savPlace:pr.savPlace||(placesAgg()[0]||{}).name||'',acc:pr.acc||defaultAcc(),note:pr.note||''};
  }
  S.sheet={kind:'inv',id:x?x.id:null,ts:x?x.ts:null,convertFromPatId:pr.convertFromPatId||null};
  const title=x?'Editar movimiento':(pr.convertFromPatId?'Convertir retiro a Préstamo / Inv.':(v.act==='out'?'Registrar Préstamo / Inversión':'Registrar Cobro / Dividendo'));

function saveInv(){
  const v=invValues();
  const entity=v.entity.trim(), amount=parseAmount(v.amt);
  if(!entity)return fail(v.cat==='loan'?'Escribe el nombre de la persona (ej. Alberto, Jeen).':'Escribe el nombre de la empresa o inversión.');
  if(!(amount>0))return fail('Escribe un monto mayor a 0.');
  if(!v.date)return fail('Elige una fecha.');
  let expInt=0;
  if(v.cat==='loan'&&v.act==='out'&&v.expInt.trim()){
    expInt=parseAmount(v.expInt);
    if(!(expInt>0))return fail('El interés acordado debe ser un número mayor a 0.');
  }
  if(v.src==='sav'&&!v.savPlace.trim())return fail('Indica el lugar de Ahorros.');
  if(v.src==='acc'&&!v.acc)return fail('Elige una cuenta personal.');
  const doc={k:'inv',category:v.cat,action:v.act,entity:entity,amount:amount,date:v.date,sourceType:v.src,note:v.note.trim(),ts:S.sheet.ts||Date.now()};
  if(expInt>0) doc.expectedInterest=expInt;
  if(v.src==='sav') doc.savPlace=v.savPlace.trim();
  if(v.src==='acc') doc.acc=v.acc;
  const oldPatId=S.sheet.convertFromPatId;
  const isNew=!S.sheet.id;
  put(S.sheet.id||('i'+uid()),doc);
  if(oldPatId) del(oldPatId);
  closeSheet();
  toast(oldPatId?'Retiro convertido correctamente':(isNew?'Movimiento guardado':'Movimiento actualizado'));
  return true;
}

/* ================= Cuentas, Tarjetas, Conceptos ================= */
function openAcc(a){
  S.sheet={kind:'acc',id:a?a.id:null};
  const used=a&&(S.tx.some(function(t){return t.acc===a.id||t.to===a.id;})||S.pat.some(function(p){return p.acc===a.id;})||S.inv.some(function(x){return x.acc===a.id;}));
  const html='<form id="sheet-form" novalidate autocomplete="off"><div class="field"><label for="ac-name">Nombre de la cuenta</label><input id="ac-name" maxlength="40" value="'+esc(a?a.name:'')+'" placeholder="Ej. Scotiabank"></div>'+
    '<div class="field"><label for="ac-init">Saldo con el que empiezas (S/)</label><input id="ac-init" inputmode="decimal" value="'+esc(a&&a.initial?String(a.initial):'')+'" placeholder="0.00"><span class="hint">Lo que tienes hoy en esta cuenta, antes de registrar movimientos.</span></div>'+
    '<p class="err" id="sheet-err" role="alert" hidden></p><div class="actions"><button type="submit" class="btn primary grow">Guardar</button></div>'+
    (a?(used?'<p class="hint">Esta cuenta tiene movimientos, por eso no se puede eliminar. Puedes cambiarle el nombre.</p>':delBlock('esta cuenta')):'')+'</form>';

function saveAcc(){
  const name=$('#ac-name').value.trim(),raw=$('#ac-init').value.trim();
  if(!name)return fail('Escribe un nombre.');
  const ini=raw?parseAmount(raw,true):0;if(raw&&isNaN(ini))return fail('El saldo no es un número válido.');
  const id=S.sheet.id;
  editCfg(function(c){
    if(id){const a=c.accounts.find(function(x){return x.id===id;});if(a){a.name=name;a.initial=ini;}}
    else c.accounts.push({id:'a'+uid(),name:name,initial:ini});
  });
  closeSheet();toast('Cuenta guardada');return true;
}

function openCard(c){
  S.sheet={kind:'card',id:c?c.id:null};
  const val=function(x){return x==null||x===''?'':esc(String(x));};
  const html='<form id="sheet-form" novalidate autocomplete="off"><div class="field"><label for="cd-name">Nombre</label><input id="cd-name" maxlength="40" value="'+val(c&&c.name)+'" placeholder="Ej. Tarjeta Falabella"></div>'+
    '<div class="row2"><div class="field"><label for="cd-limit">Línea (S/)</label><input id="cd-limit" inputmode="decimal" value="'+val(c&&c.limit)+'"></div><div class="field"><label for="cd-debt">Deuda actual (S/)</label><input id="cd-debt" inputmode="decimal" value="'+val(c&&c.debt)+'"></div></div>'+

    '<div class="field"><label for="cd-note">Nota</label><input id="cd-note" maxlength="120" value="'+val(c&&c.note)+'"></div>'+
    '<p class="err" id="sheet-err" role="alert" hidden></p><div class="actions"><button type="submit" class="btn primary grow">Guardar</button></div>'+(c?delBlock('esta tarjeta'):'')+'</form>';
  openSheet('card',c?'Editar tarjeta':'Nueva tarjeta',html,S.sheet,'#cd-name');
}
function saveCard(){
  const name=$('#cd-name').value.trim();if(!name)return fail('Escribe un nombre.');
  const num=function(id){const r=$('#'+id).value.trim();return r?parseAmount(r):null;};
  const limit=num('cd-limit'),debt=num('cd-debt');
  if((limit!==null&&isNaN(limit))||(debt!==null&&isNaN(debt)))return fail('Línea y deuda deben ser números.');
  const dr=$('#cd-day').value.trim();const day=dr?parseInt(dr,10):null;
  if(dr&&!(day>=1&&day<=31))return fail('El día de pago va de 1 a 31.');
  const note=$('#cd-note').value.trim(),id=S.sheet.id;
  editCfg(function(c){
    if(id){const x=c.cards.find(function(k){return k.id===id;});if(x){x.name=name;x.limit=limit;x.debt=debt;x.payDay=day;x.note=note;}}
    else c.cards.push({id:'k'+uid(),name:name,limit:limit,debt:debt,payDay:day,note:note});
  });
  closeSheet();toast('Tarjeta guardada');return true;
}

function subRowHtml(s){return '<div class="sub-row" data-id="'+esc(s?s.id:'')+'"><input aria-label="Nombre del detalle" maxlength="40" value="'+esc(s?s.name:'')+'" placeholder="Nombre del detalle"><button type="button" class="icon-btn" data-a="rm-sub" aria-label="Quitar detalle">'+ICON.x+'</button></div>';}
function openCpt(type,c){
  S.sheet={kind:'cpt',type:type,id:c?c.id:null};
  const used=c?S.tx.filter(function(t){return t.type===type&&t.cat===c.id;}).length:0;
  let html='<form id="sheet-form" novalidate autocomplete="off"><div class="field"><label for="cp-name">Nombre del concepto</label><input id="cp-name" maxlength="50" value="'+esc(c?c.name:'')+'" placeholder="'+(type==='in'?'Ej. Venta de garaje':'Ej. Mascotas')+'"></div>';
  if(type==='out'){
    html+='<div class="field"><label>Tipo de gasto</label><div class="seg seg-full" role="radiogroup"><input type="radio" name="cp-kind" id="ck-need" value="need"'+(!c||c.kind!=='want'?' checked':'')+'><label for="ck-need">Necesidad</label><input type="radio" name="cp-kind" id="ck-want" value="want"'+(c&&c.kind==='want'?' checked':'')+'><label for="ck-want">Deseo</label></div><span class="hint">Se usa para comparar con la regla 50% necesidades, 30% deseos, 20% ahorro.</span></div>'+
      '<div class="field"><label for="cp-budget">Límite mensual (S/, opcional)</label><input id="cp-budget" inputmode="decimal" value="'+esc(c&&c.budget>0?String(c.budget):'')+'" placeholder="Sin límite"></div>'+

  }

  if(c){html+=(used?'<p class="hint">Hay '+used+' movimientos con este concepto. Si lo eliminas, se conservan con su nombre actual.</p>':'')+delBlock('este concepto');}
  html+='</form>';
  openSheet('cpt',c?'Editar concepto':'Nuevo concepto de '+(type==='in'?'ingreso':'egreso'),html,S.sheet,'#cp-name');
}
function saveCpt(){
  const name=$('#cp-name').value.trim();if(!name)return fail('Escribe un nombre.');
  const type=S.sheet.type,id=S.sheet.id;
  let kind='need',budget=null,subs=[];
  if(type==='out'){
    kind=$('#ck-want').checked?'want':'need';
    const br=$('#cp-budget').value.trim();if(br){budget=parseAmount(br);if(!(budget>0))return fail('El límite debe ser un número mayor a 0.');}
    subs=$$('#sub-list .sub-row').map(function(r){return {id:r.dataset.id||('s'+uid()),name:r.querySelector('input').value.trim()};}).filter(function(s){return s.name;});
  }
  editCfg(function(c){
    const list=type==='in'?c.income:c.expense;
    if(id){const x=list.find(function(k){return k.id===id;});if(x){x.name=name;if(type==='out'){x.kind=kind;x.budget=budget;x.subs=subs;}}}
    else list.push(type==='in'?{id:'c'+uid(),name:name}:{id:'c'+uid(),name:name,kind:kind,budget:budget,subs:subs});
  });
  closeSheet();toast('Concepto guardado');return true;
}

function doDelete(){
  const s=S.sheet;if(!s||!s.id)return;
  if(s.kind==='tx'){del(s.id);}
  else if(s.kind==='pat'){del(s.id);}
  else if(s.kind==='inv'){del(s.id);}
  else if(s.kind==='acc'){editCfg(function(c){c.accounts=c.accounts.filter(function(a){return a.id!==s.id;});});}
  else if(s.kind==='card'){editCfg(function(c){c.cards=c.cards.filter(function(a){return a.id!==s.id;});});}
  else if(s.kind==='cpt'){editCfg(function(c){if(s.type==='in')c.income=c.income.filter(function(a){return a.id!==s.id;});else c.expense=c.expense.filter(function(a){return a.id!==s.id;});});}
  closeSheet();toast('Eliminado');
}

function reconUpdate(id){
  const inp=$('#rc-'+id),out=$('#rcout-'+id);if(!inp||!out)return;
  const raw=inp.value.trim();if(!raw){out.innerHTML='';return;}
  const real=parseAmount(raw,true);if(isNaN(real)){out.innerHTML='<span class="muted">Escribe un número.</span>';return;}
  const diff=Math.round((real-(S.bal[id]||0))*100)/100;
  if(Math.abs(diff)<0.005)out.innerHTML='<span class="ok">✓ Cuadra con lo registrado</span>';
  else out.innerHTML='<div class="diff"><span>'+(diff>0?'Tienes '+money(diff)+' más de lo registrado.':'Tienes '+money(-diff)+' menos de lo registrado.')+'</span><button type="button" class="btn small" data-a="adjust" data-id="'+esc(id)+'" data-v="'+diff+'">Registrar ajuste de '+money(diff,{sign:true})+'</button></div>';
}
function doAdjust(id,diff){
  const doc={k:'tx',type:diff>0?'in':'out',adj:true,date:todayStr(),amount:Math.abs(diff),cat:'ajuste',catName:'Ajuste de saldo',acc:id,note:'Ajuste al cuadrar con el saldo real',ts:Date.now()};
  put('t'+uid(),doc);toast('Ajuste registrado');
}

function buildDemo(){
  const docs=new Map(),cfg=defaultCfg();
  const ini={bcp1:850,bcp2:420,bbva:1630,interbank:300,agora:90,efectivo:140};cfg.accounts.forEach(function(a){a.initial=ini[a.id]||0;});
  const bud={comida:650,nocturnos:200,gasolina:450};cfg.expense.forEach(function(c){if(bud[c.id])c.budget=bud[c.id];});
  Object.assign(cfg.cards[0],{limit:3000,debt:1180,payDay:18});Object.assign(cfg.cards[1],{limit:2000,debt:0});Object.assign(cfg.cards[2],{limit:5000,debt:2350,payDay:5});
  docs.set('cfg',cfg);
  let seed=11;const rnd=function(){seed=seed*16807%2147483647;return seed/2147483647;};

  const now=curMonth(),today=new Date().getDate();let n=0;

    ['comida','almuerzo',[13,19],16,['efectivo','agora']],['comida','callejera',[5,12],8,['efectivo']],['gasolina',null,[70,120],4,['bbva']],['pareja',null,[70,190],3,['bcp2','bbva']],['nocturnos',null,[60,170],3,['bcp2']],
    ['salud',null,[40,110],1,['bbva']],['aseo',null,[30,60],1,['efectivo']],['vestimenta',null,[90,230],1,['interbank']],['extras',null,[25,90],2,['agora']],['mant-veh',null,[120,260],1,['bbva']]];
  for(let b=3;b>=0;b--){
    const m=shiftMonth(now,-b);
    tx('in',m,1,3200,'sueldo-a',null,'bcp1');tx('in',m,15,1450,'sueldo-b',null,'bbva');tx('in',m,20,between(180,420),'comision-a',null,'bbva');
    if(b%2===0)tx('in',m,9,150,'extras',null,'bcp2');
    outs.forEach(function(o){
      const boost=(b===0&&o[0]==='nocturnos')?2.2:1,cnt=(b===0&&o[0]==='nocturnos')?5:o[3];
      for(let i=0;i<cnt;i++){tx('out',m,1+Math.floor(rnd()*28),between(o[2][0]*boost,o[2][1]*boost),o[0],o[1],o[4][i%o[4].length]);}
    });
  }
  [[-5,'Cuenta de ahorros BCP',600],[-4,'Cuenta de ahorros BCP',400],[-3,'Fondo mutuo',500],[-2,'Cuenta de ahorros BCP',350],[-1,'Fondo mutuo',300],[-1,'Efectivo en casa',200],[0,'Cuenta de ahorros BCP',250]].forEach(function(p,i){
    const m=shiftMonth(now,p[0]);const day=p[0]===0?Math.min(5,today):5;
    docs.set('p'+i,{k:'pat',date:m+'-'+pad(day),amount:p[2],place:p[1],note:'',ts:2000+i});
  });
  docs.set('i1',{k:'inv',category:'loan',action:'out',entity:'Alberto',amount:400,expectedInterest:40,date:shiftMonth(now,-1)+'-10',sourceType:'sav',savPlace:'Cuenta de ahorros BCP',note:'Préstamo con interés',ts:3001});
  docs.set('i2',{k:'inv',category:'loan',action:'out',entity:'Jeen',amount:300,date:now+'-03',sourceType:'sav',savPlace:'Cuenta de ahorros BCP',note:'',ts:3002});
  docs.set('i3',{k:'inv',category:'invest',action:'out',entity:'Empresa',amount:1000,date:shiftMonth(now,-2)+'-05',sourceType:'sav',savPlace:'Fondo mutuo',note:'Aporte inicial',ts:3003});
  docs.set('i4',{k:'inv',category:'invest',action:'profit',entity:'Empresa',amount:120,date:shiftMonth(now,-1)+'-28',sourceType:'acc',acc:'bbva',note:'Dividendo mensual',ts:3004});
  return docs;
}

const WRITE_ACTIONS={'new':1,'new-pat-dep':1,'new-pat-ret':1,'new-inv-out':1,'new-inv-in':1,'quick-inv':1,'pat-to-inv':1,'edit-tx':1,'edit-pat':1,'edit-inv':1,'new-acc':1,'edit-acc':1,'new-card':1,'edit-card':1,'new-cpt':1,'edit-cpt':1,'adjust':1};
document.addEventListener('click',function(e){
  const ov=$('#overlay');
  if(e.target===ov){closeSheet();return;}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  if(S.demo&&WRITE_ACTIONS[a]){toast('Estás viendo datos de ejemplo: nada se guarda. Sal del ejemplo para registrar lo tuyo.');return;}
  switch(a){
    case 'install-pwa':
      if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice){
          if(choice.outcome === 'accepted') $('#install-btn').hidden = true;
          deferredPrompt = null;
        });
      } else if(isIOS){
        toast('En iPhone/iPad: toca el botón Compartir de tu navegador y elige «Agregar a inicio».');
      } else {
        toast('Abre el menú (⋮) del navegador y elige «Instalar aplicación».');
      }
      break;
    case 'cfg-url':configurarUrlSheets();break;
    case 'tab':S.tab=el.dataset.v;renderAll();window.scrollTo(0,0);break;
    case 'prev':S.month=shiftMonth(S.month,-1);renderAll();break;

    case 'new-pat-ret':openPat(null,'ret');break;
    case 'new-inv-out':openInv(null,{cat:'loan',act:'out'});break;
    case 'new-inv-in':openInv(null,{cat:'invest',act:'profit'});break;

    case 'pat-to-inv':{
      const p=S.pat.find(function(x){return x.id===S.sheet.id;});
      if(p) openInv(null,{convertFromPatId:p.id,cat:'loan',act:'out',amt:String(Math.abs(p.amount)),date:p.date,src:'sav',savPlace:p.place||'',note:p.note||''});

    case 'edit-cpt':openCpt(el.dataset.t,catList(el.dataset.t).find(function(x){return x.id===id;}));break;
    case 'toggle-cat':S.expanded[id]=!S.expanded[id];renderView();break;
    case 'flt-type':S.filters.type=el.dataset.v;renderView();break;
    case 'flt-inv-cat':S.invFilters.cat=el.dataset.v;renderView();break;
    case 'close':closeSheet();break;
    case 'save-again':saveTx(true);break;
    case 'del-ask':el.hidden=true;$('#del-confirm').hidden=false;break;
    case 'del-cancel':$('#del-confirm').hidden=true;$('[data-a="del-ask"]').hidden=false;break;
    case 'del-do':doDelete();break;
    case 'add-sub':{const l=$('#sub-list');l.insertAdjacentHTML('beforeend',subRowHtml(null));const i=l.querySelectorAll('input');i[i.length-1].focus();break;}
    case 'rm-sub':el.closest('.sub-row').remove();break;
    case 'adjust':doAdjust(id,parseFloat(el.dataset.v));{const i=$('#rc-'+id);if(i)i.value='';}break;
    case 'demo-on':S.demo=true;S.demoDocs=buildDemo();S.month=curMonth();S.tab='resumen';changed();break;
    case 'demo-off':S.demo=false;S.demoDocs=null;changed();break;
  }
});
